name: ci

# Each app's checks on every PR and main, in pinned images; a job's checks run only once its apps exist.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # uv's own image, so uv is pinned by digest along with Python.
    container: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie-slim@sha256:e586c1c65b7071aec78f02c5587c76c5011159cd76b3d6f1255f40e48e850abc
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format, lint, types and tests
        if: hashFiles('pyproject.toml') != ''
        run: |
          uv sync --locked
          uv run ruff format --check
          uv run ruff check
          uv run pyright
          uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, types, tests and build
        if: hashFiles('apps/web/package-lock.json') != ''
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img"><title>An agent is a model inside a harness</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1100" height="560" rx="16" fill="#ffffff"/><text x="20" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="20" dy="0">An agent is a model inside a harness</tspan></text><text x="20" y="70" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="20" dy="0">The model writes the code. The harness decides what it knows, what it can touch and what stops it.</tspan></text><rect x="400" y="96" width="300" height="66" rx="33" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="550" y="124" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle"><tspan x="550" dy="0">You</tspan></text><text x="550" y="145" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle"><tspan x="550" dy="0">set the goal, approve each gate</tspan></text><line x1="550" y1="162" x2="550" y2="214" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="400" y="216" width="300" height="150" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="550" y="244" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle"><tspan x="550" dy="0">Coding agent</tspan></text><rect x="470" y="262" width="160" height="54" rx="27" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/><text x="550" y="294" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle"><tspan x="550" dy="0">Model</tspan></text><text x="550" y="344" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle"><tspan x="550" dy="0">plans, writes, tests, fixes</tspan></text><rect x="20" y="216" width="330" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="38" y="244" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="38" dy="0">Context: what it knows</tspan></text><text x="38" y="270" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="38" dy="0">AGENTS.md rules · business context · spec · plan</tspan><tspan x="38" dy="17.55">· threat model · code standards · status and</tspan><tspan x="38" dy="17.55">decisions</tspan></text><line x1="352" y1="291" x2="398" y2="291" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="750" y="216" width="330" height="150" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="768" y="244" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="768" dy="0">Tools: what it can touch</tspan></text><text x="768" y="270" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="768" dy="0">git and gh · uv and npm · terraform validate ·</tspan><tspan x="768" dy="17.55">local scanners · subagents for review</tspan></text><line x1="702" y1="291" x2="748" y2="291" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="410" width="1060" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="38" y="438" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="38" dy="0">Guardrails: what stops it, weakest to strongest</tspan></text><text x="38.0" y="474" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start"><tspan x="38.0" dy="0">1. Asked</tspan></text><text x="38.0" y="496" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="38.0" dy="0">AGENTS.md rules</tspan></text><text x="250.0" y="474" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start"><tspan x="250.0" dy="0">2. Checked</tspan></text><text x="250.0" y="496" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="250.0" dy="0">pre-push scan</tspan></text><text x="462.0" y="474" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start"><tspan x="462.0" dy="0">3. Enforced</tspan></text><text x="462.0" y="496" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="462.0" dy="0">required PR checks,</tspan><tspan x="462.0" dy="17.55">protected main</tspan></text><text x="674.0" y="474" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start"><tspan x="674.0" dy="0">4. Limited</tspan></text><text x="674.0" y="496" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="674.0" dy="0">read-only plan role, no</tspan><tspan x="674.0" dy="17.55">secrets</tspan></text><text x="886.0" y="474" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start"><tspan x="886.0" dy="0">5. Approved</tspan></text><text x="886.0" y="496" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="886.0" dy="0">you sign off merge and</tspan><tspan x="886.0" dy="17.55">deploy</tspan></text><line x1="550" y1="368" x2="550" y2="408" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/></svg>

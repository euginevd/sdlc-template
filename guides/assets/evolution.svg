<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 370" width="1240" height="370" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img"><title>Evolution to the secure agentic SDLC</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1240" height="370" rx="16" fill="#ffffff"/><text x="20" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="20" dy="0">From waterfall to the secure agentic SDLC</tspan></text><text x="20" y="70" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="20" dy="0">Each step fixed the last one's biggest gap. The newest keeps every control and adds agents.</tspan></text><rect x="20.0" y="100" width="181.66666666666666" height="220" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="34.0" y="130" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="34.0" dy="0">Waterfall</tspan></text><text x="34.0" y="152" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="34.0" dy="0">1970s</tspan></text><text x="34.0" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="34.0" dy="0">One pass, from</tspan><tspan x="34.0" dy="18.900000000000002">requirements to</tspan><tspan x="34.0" dy="18.900000000000002">release</tspan></text><line x1="34.0" y1="250" x2="187.66666666666666" y2="250" stroke="#e5e7eb"/><text x="34.0" y="270" font-size="11" font-weight="700" fill="#4b5563" text-anchor="start"><tspan x="34.0" dy="0">What it left open</tspan></text><text x="34.0" y="288" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="34.0" dy="0">Feedback arrives at the</tspan><tspan x="34.0" dy="17.55">end</tspan></text><line x1="204.66666666666666" y1="210" x2="220.66666666666666" y2="210" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="223.66666666666666" y="100" width="181.66666666666666" height="220" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="237.66666666666666" y="130" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="237.66666666666666" dy="0">Agile</tspan></text><text x="237.66666666666666" y="152" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="237.66666666666666" dy="0">2001</tspan></text><text x="237.66666666666666" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="237.66666666666666" dy="0">Short sprints with</tspan><tspan x="237.66666666666666" dy="18.900000000000002">customer feedback</tspan></text><line x1="237.66666666666666" y1="250" x2="391.3333333333333" y2="250" stroke="#e5e7eb"/><text x="237.66666666666666" y="270" font-size="11" font-weight="700" fill="#4b5563" text-anchor="start"><tspan x="237.66666666666666" dy="0">What it left open</tspan></text><text x="237.66666666666666" y="288" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="237.66666666666666" dy="0">Shipping is still slow</tspan><tspan x="237.66666666666666" dy="17.55">and manual</tspan></text><line x1="408.3333333333333" y1="210" x2="424.3333333333333" y2="210" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="427.3333333333333" y="100" width="181.66666666666666" height="220" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="441.3333333333333" y="130" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="441.3333333333333" dy="0">DevOps</tspan></text><text x="441.3333333333333" y="152" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="441.3333333333333" dy="0">2009</tspan></text><text x="441.3333333333333" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="441.3333333333333" dy="0">Dev and ops share one</tspan><tspan x="441.3333333333333" dy="18.900000000000002">automated pipeline</tspan></text><line x1="441.3333333333333" y1="250" x2="595.0" y2="250" stroke="#e5e7eb"/><text x="441.3333333333333" y="270" font-size="11" font-weight="700" fill="#4b5563" text-anchor="start"><tspan x="441.3333333333333" dy="0">What it left open</tspan></text><text x="441.3333333333333" y="288" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="441.3333333333333" dy="0">Security is checked last</tspan></text><line x1="612.0" y1="210" x2="628.0" y2="210" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="631.0" y="100" width="181.66666666666666" height="220" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="645.0" y="130" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="645.0" dy="0">DevSecOps</tspan></text><text x="645.0" y="152" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="645.0" dy="0">2010s</tspan></text><text x="645.0" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="645.0" dy="0">Security shifts left,</tspan><tspan x="645.0" dy="18.900000000000002">into every stage</tspan></text><line x1="645.0" y1="250" x2="798.6666666666666" y2="250" stroke="#e5e7eb"/><text x="645.0" y="270" font-size="11" font-weight="700" fill="#4b5563" text-anchor="start"><tspan x="645.0" dy="0">What it left open</tspan></text><text x="645.0" y="288" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="645.0" dy="0">People still write every</tspan><tspan x="645.0" dy="17.55">line</tspan></text><line x1="815.6666666666666" y1="210" x2="831.6666666666666" y2="210" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="834.6666666666666" y="100" width="181.66666666666666" height="220" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="848.6666666666666" y="130" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="848.6666666666666" dy="0">AI-assisted</tspan></text><text x="848.6666666666666" y="152" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="848.6666666666666" dy="0">2021</tspan></text><text x="848.6666666666666" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="848.6666666666666" dy="0">Copilots suggest code</tspan><tspan x="848.6666666666666" dy="18.900000000000002">while a person drives</tspan></text><line x1="848.6666666666666" y1="250" x2="1002.3333333333333" y2="250" stroke="#e5e7eb"/><text x="848.6666666666666" y="270" font-size="11" font-weight="700" fill="#4b5563" text-anchor="start"><tspan x="848.6666666666666" dy="0">What it left open</tspan></text><text x="848.6666666666666" y="288" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="848.6666666666666" dy="0">Helps with coding, not</tspan><tspan x="848.6666666666666" dy="17.55">delivery</tspan></text><line x1="1019.3333333333333" y1="210" x2="1035.3333333333333" y2="210" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="1038.3333333333333" y="100" width="181.66666666666666" height="220" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="2.5"/><text x="1052.3333333333333" y="130" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="1052.3333333333333" dy="0">Secure agentic</tspan></text><text x="1052.3333333333333" y="152" font-size="13" font-weight="600" fill="#d97757" text-anchor="start"><tspan x="1052.3333333333333" dy="0">Now</tspan></text><text x="1052.3333333333333" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="1052.3333333333333" dy="0">Agents plan, build and</tspan><tspan x="1052.3333333333333" dy="18.900000000000002">test; controls check;</tspan><tspan x="1052.3333333333333" dy="18.900000000000002">people decide</tspan></text><line x1="1052.3333333333333" y1="250" x2="1206.0" y2="250" stroke="#e5e7eb"/><text x="1052.3333333333333" y="270" font-size="11" font-weight="700" fill="#4b5563" text-anchor="start"><tspan x="1052.3333333333333" dy="0">What it keeps</tspan></text><text x="1052.3333333333333" y="288" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="1052.3333333333333" dy="0">Keeps every DevSecOps</tspan><tspan x="1052.3333333333333" dy="17.55">control</tspan></text><text x="20" y="352" font-size="13" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="20" dy="0">Who writes the code:  people  →  people, with AI suggestions  →  agents, inside rules people set and checks they can't skip</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 944" width="1240" height="944" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img"><title>The secure agentic SDLC: who does what</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1240" height="944" rx="16" fill="#ffffff"/><text x="20" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="20" dy="0">The secure agentic SDLC: who does what</tspan></text><text x="20" y="70" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="20" dy="0">Agents do the work. Controls check it automatically and block what fails. People decide at the gates.</tspan></text><text x="230.0" y="104" font-size="15" font-weight="700" fill="#d97757" text-anchor="middle"><tspan x="230.0" dy="0">Agent does</tspan></text><text x="535.0" y="104" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle"><tspan x="535.0" dy="0">Stage</tspan></text><text x="835.0" y="104" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle"><tspan x="835.0" dy="0">Controls check (automatic, blocking)</tspan></text><text x="1120.0" y="104" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle"><tspan x="1120.0" dy="0">People decide</tspan></text><rect x="80" y="116" width="1140" height="26" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="650.0" y="134" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle"><tspan x="650.0" dy="0">Context in every stage: AGENTS.md · business context · spec · plan · threat model · decisions</tspan></text><rect x="80" y="158" width="300" height="96" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="96" y="201.45000000000002" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="96" dy="0">Drafts the spec, then the plan and</tspan><tspan x="96" dy="18.900000000000002">threat model. No code yet</tspan></text><line x1="382" y1="206.0" x2="417" y2="206.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="420" y="158" width="230" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="420" y="158" width="8" height="96" rx="4" fill="#2563eb"/><text x="444" y="198" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="444" dy="0">1. Plan</tspan></text><text x="444" y="222" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="444" dy="0">Spec · plan · threat model</tspan></text><line x1="535.0" y1="255" x2="535.0" y2="270" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="158" width="290" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="706" y="201.45000000000002" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="706" dy="0">AGENTS.md: no code before the plan</tspan><tspan x="706" dy="18.900000000000002">is approved</tspan></text><line x1="688" y1="206.0" x2="653" y2="206.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="1020" y="158" width="200" height="96" rx="10" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="1036" y="182" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="1036" dy="0">Gate</tspan></text><text x="1036" y="213.45000000000002" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start"><tspan x="1036" dy="0">You approve the spec and</tspan><tspan x="1036" dy="18.900000000000002">the plan</tspan></text><line x1="1018" y1="206.0" x2="983" y2="206.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="80" y="272" width="300" height="96" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="96" y="315.45" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="96" dy="0">Builds each phase with tests; a</tspan><tspan x="96" dy="18.900000000000002">second agent reviews the diff</tspan></text><line x1="382" y1="320.0" x2="417" y2="320.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="420" y="272" width="230" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="420" y="272" width="8" height="96" rx="4" fill="#2563eb"/><text x="444" y="312" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="444" dy="0">2. Code</tspan></text><text x="444" y="336" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="444" dy="0">Phases · tests · local commits</tspan></text><line x1="535.0" y1="369" x2="535.0" y2="384" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="272" width="290" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="706" y="315.45" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="706" dy="0">Pre-push scan: secrets and</tspan><tspan x="706" dy="18.900000000000002">vulnerable packages</tspan></text><line x1="688" y1="320.0" x2="653" y2="320.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="80" y="386" width="300" height="96" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="96" y="429.45" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="96" dy="0">Opens the PR and fixes every finding</tspan><tspan x="96" dy="18.900000000000002">at its cause</tspan></text><line x1="382" y1="434.0" x2="417" y2="434.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="420" y="386" width="230" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="420" y="386" width="8" height="96" rx="4" fill="#2563eb"/><text x="444" y="426" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="444" dy="0">3. Build and test</tspan></text><text x="444" y="450" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="444" dy="0">Pull request · CI</tspan></text><line x1="535.0" y1="483" x2="535.0" y2="498" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="386" width="290" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="706" y="420.0" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="706" dy="0">Required checks: tests, Semgrep,</tspan><tspan x="706" dy="18.900000000000002">CodeQL, Gitleaks, Trivy, Checkov,</tspan><tspan x="706" dy="18.900000000000002">Terraform plan</tspan></text><line x1="688" y1="434.0" x2="653" y2="434.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="80" y="500" width="300" height="96" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="96" y="543.4499999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="96" dy="0">Answers review comments, then</tspan><tspan x="96" dy="18.900000000000002">squash-merges once approved</tspan></text><line x1="382" y1="548.0" x2="417" y2="548.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="420" y="500" width="230" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="420" y="500" width="8" height="96" rx="4" fill="#2563eb"/><text x="444" y="540" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="444" dy="0">4. Release</tspan></text><text x="444" y="564" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="444" dy="0">Review · merge</tspan></text><line x1="535.0" y1="597" x2="535.0" y2="612" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="500" width="290" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="706" y="543.4499999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="706" dy="0">Protected main: no direct push;</tspan><tspan x="706" dy="18.900000000000002">checks must pass on the latest main</tspan></text><line x1="688" y1="548.0" x2="653" y2="548.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="1020" y="500" width="200" height="96" rx="10" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="1036" y="524" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="1036" dy="0">Gate</tspan></text><text x="1036" y="546.0" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start"><tspan x="1036" dy="0">You review the diff and</tspan><tspan x="1036" dy="18.900000000000002">security summary, then</tspan><tspan x="1036" dy="18.900000000000002">approve</tspan></text><line x1="1018" y1="548.0" x2="983" y2="548.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="80" y="614" width="300" height="96" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="96" y="666.9" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="96" dy="0">Can't deploy: only the pipeline can</tspan></text><line x1="382" y1="662.0" x2="417" y2="662.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="420" y="614" width="230" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="420" y="614" width="8" height="96" rx="4" fill="#2563eb"/><text x="444" y="654" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="444" dy="0">5. Deploy</tspan></text><text x="444" y="678" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="444" dy="0">Terraform apply</tspan></text><line x1="535.0" y1="711" x2="535.0" y2="726" stroke="#4b5563" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="614" width="290" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="706" y="657.4499999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="706" dy="0">Plan with a read-only role; apply</tspan><tspan x="706" dy="18.900000000000002">with a separate role; /health check</tspan></text><line x1="688" y1="662.0" x2="653" y2="662.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="1020" y="614" width="200" height="96" rx="10" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><rect x="1023" y="617" width="194" height="90" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="1036" y="638" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="1036" dy="0">Hard gate</tspan></text><text x="1036" y="669.4499999999999" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start"><tspan x="1036" dy="0">You approve every apply;</tspan><tspan x="1036" dy="18.900000000000002">production only by hand</tspan></text><line x1="1018" y1="662.0" x2="983" y2="662.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="80" y="728" width="300" height="96" rx="10" fill="#fde8df" stroke="#d97757" stroke-width="1.5"/><text x="96" y="771.4499999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="96" dy="0">Updates status and decisions; turns</tspan><tspan x="96" dy="18.900000000000002">findings into the next change</tspan></text><line x1="382" y1="776.0" x2="417" y2="776.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="420" y="728" width="230" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="420" y="728" width="8" height="96" rx="4" fill="#2563eb"/><text x="444" y="768" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start"><tspan x="444" dy="0">6. Operate and monitor</tspan></text><text x="444" y="792" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="444" dy="0">Status · findings</tspan></text><rect x="690" y="728" width="290" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="706" y="771.4499999999999" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start"><tspan x="706" dy="0">Weekly rescans · Dependabot · alerts</tspan><tspan x="706" dy="18.900000000000002">on failed runs</tspan></text><line x1="688" y1="776.0" x2="653" y2="776.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="1020" y="728" width="200" height="96" rx="10" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="1036" y="752" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start"><tspan x="1036" dy="0">Gate</tspan></text><text x="1036" y="783.4499999999999" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start"><tspan x="1036" dy="0">You own incidents and</tspan><tspan x="1036" dy="18.900000000000002">decide what's next</tspan></text><line x1="1018" y1="776.0" x2="983" y2="776.0" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="1020" y="272" width="200" height="210" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1120.0" y="342" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle"><tspan x="1120.0" dy="0">No person here</tspan></text><text x="1120.0" y="368" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle"><tspan x="1120.0" dy="0">The agent fixes findings</tspan><tspan x="1120.0" dy="17.55">and reruns until every</tspan><tspan x="1120.0" dy="17.55">check passes. It never</tspan><tspan x="1120.0" dy="17.55">weakens a check to get a</tspan><tspan x="1120.0" dy="17.55">green run</tspan></text><path d="M78,776.0 H36 V206.0 H76" fill="none" stroke="#d97757" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text transform="translate(28,491.0) rotate(-90)" font-size="13" font-weight="700" fill="#d97757" text-anchor="middle">Outer loop: what you learn in production feeds the next spec</text><path d="M78,460 H64 V294 H76" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a)"/><text transform="translate(58,377.0) rotate(-90)" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">Inner loop: fix, rerun</text><rect x="80" y="848" width="1140" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="650.0" y="868" font-size="13" font-weight="600" fill="#16a34a" text-anchor="middle"><tspan x="650.0" dy="0">Guardrails around every stage: least-privilege roles · no secrets in reach · pinned, week-old packages · every change in Git</tspan></text><rect x="80" y="896" width="18" height="18" rx="4" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/><text x="106" y="910" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="106" dy="0">Gate: a person approves before it moves on</tspan></text><rect x="420" y="896" width="18" height="18" rx="4" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/><text x="446" y="910" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="446" dy="0">Hard gate: GitHub enforces the approval</tspan></text><rect x="740" y="896" width="18" height="18" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="766" y="910" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="766" dy="0">Automatic: the checks decide</tspan></text></svg>
